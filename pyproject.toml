[project]
name = "antennamax"
version = "0.0.1"
description = "Modern antenna simulator for amateur radio: wire, Yagi, magnetic loop, helix, QFH, patch, dish — with 3D-printable parts and build kits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JF9SOM" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pynec>=2.4",
]

[project.optional-dependencies]
rf = ["scikit-rf>=1.0"]
cad = ["build123d>=0.9"]
plot = ["matplotlib>=3.8"]
gui = ["PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.11", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "pytest-qt>=4.4"]

[project.scripts]
antennamax = "antennamax.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antennamax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openems: requires openEMS (skipped if not installed)",
    "slow: long-running simulation",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PTH"]
